# En localhost, Decap usa el proxy local (npx decap-server) y escribe en tu repo Git local.
# En producción sigue usando GitHub.
local_backend: true

backend:
  name: github
  repo: MihaiStu/blog-admi
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Artículos"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text", required: false }
      - { label: "Fecha publicación", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Categoría", name: "category", widget: "select", options: ["operaciones", "cumplimiento", "fiscalidad", "vehiculos", "tarjetas-gasoil", "actualidad"] }
      - { label: "Imagen", name: "image", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "paginas"
    label: "Páginas"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "proyectos"
    label: "Proyectos"
    folder: "src/content/proyectos"
    create: true
    slug: "{{slug}}"
    identifier_field: "slug"
    fields:
      - { label: "Slug (nombre archivo)", name: "slug", widget: "string", hint: "Ej: roadmaster" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción (meta)", name: "description", widget: "string", required: false }
      - { label: "Párrafo intro (¿Qué es?)", name: "intro", widget: "text" }
      - label: "Lista (¿Qué problema resuelve?)"
        name: "problemList"
        widget: "list"
        summary: "{{fields.item}}"
        fields:
          - { label: "Punto", name: "item", widget: "string" }
      - { label: "Texto capturas", name: "screenshotText", widget: "string", required: false }
      - { label: "Botón principal - texto", name: "btnPrimaryLabel", widget: "string", required: false }
      - { label: "Botón principal - enlace", name: "btnPrimaryUrl", widget: "string", required: false }
      - { label: "Botón demo - texto", name: "btnSecondaryLabel", widget: "string", required: false }
      - { label: "Botón demo - enlace", name: "btnSecondaryUrl", widget: "string", required: false }
